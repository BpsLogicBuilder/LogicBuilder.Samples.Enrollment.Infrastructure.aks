---
# Ingress for chat hub
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enrollment-chat-hub-ingress
  namespace: ENROLLMENT_APP_NAMESPACE
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,x-signalr-user-agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://enrollment.LOAD_BALANCER_IP.nip.io" # NOSONAR - DEV Only
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: enrollment-chat-hub.LOAD_BALANCER_IP.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: enrollment-chat-hub
            port:
              number: 8080

