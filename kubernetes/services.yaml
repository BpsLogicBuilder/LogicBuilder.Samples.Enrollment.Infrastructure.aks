# Kubernetes Deployments and Services for 6 Applications
# This file contains all deployments, services, and ingress configuration

# The following items will be updated with output values from the main.bicep deployment

#   LOAD_BALANCER_IP
#   APP_INSIGHTS_CONNECTION_STRING
#   ENROLLMENT_API_IDENTITY_CLIENTID
#   ENROLLMENT_API_SERVICEACCOUNT_NAME
#   ENROLLMENT_APP_NAMESPACE

---
# ConfigMap for Application Insights
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ENROLLMENT_APP_NAMESPACE
data:
  APPLICATIONINSIGHTS_CONNECTION_STRING: "APP_INSIGHTS_CONNECTION_STRING" # Will be set during deployment
  ASPNETCORE_ENVIRONMENT: "Development"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ENROLLMENT_ANGULAR_SERVICEACCOUNT_NAME
  namespace: ENROLLMENT_APP_NAMESPACE
  annotations:
    azure.workload.identity/client-id: "ENROLLMENT_ANGULAR_IDENTITY_CLIENTID"

---
apiVersion: v1
kind: Service
metadata:
  name: enrollment-angular
  namespace: ENROLLMENT_APP_NAMESPACE
spec:
  type: ClusterIP
  selector:
    app: enrollment-angular
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP

