# Host-Based Ingress using nip.io (Ready to Use - No DNS Setup Required!)
# Replace the deployments.yaml ingress section with this configuration to test host-based routing

# This uses nip.io which automatically resolves:
# - contoso-api.20.15.57.117.nip.io → 20.15.57.117
# - contoso-spa-api.20.15.57.117.nip.io → 20.15.57.117
# - etc.

# To apply: kubectl apply -f kubernetes/deployments-host-based-nip.yaml
# Then update Angular deployment with new URLs (see bottom of file)

---
# Ingress for health check endpoint
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contoso-health-ingress
  namespace: contoso-apps
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /weatherforecast
spec:
  ingressClassName: nginx
  rules:
  - host: contoso-spa-api.20.15.57.117.nip.io
    http:
      paths:
      - path: /healthz
        pathType: Exact
        backend:
          service:
            name: contoso-spa-api
            port:
              number: 8080

---
# Ingress for Workflow API
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contoso-spa-api-ingress
  namespace: contoso-apps
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: contoso-spa-api.20.15.57.117.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: contoso-spa-api
            port:
              number: 8080

