---
# After applying the above ingresses, update the Angular deployment environment variables:
#
# kubectl set env deployment/contoso-angular -n contoso-apps \
#   WORKFLOW_URL=http://contoso-spa-api.20.15.57.117.nip.io \
#   CRUD_URL=http://contoso-api.20.15.57.117.nip.io \
#   GRID_URL=http://contoso-kendo-grid-api.20.15.57.117.nip.io
