---
# After applying the above ingresses, update the Angular deployment environment variables:
#
# kubectl set env deployment/enrollment-angular -n enrollment-apps \
#   WORKFLOW_URL=http://enrollment-spa-api.20.15.57.117.nip.io \
#   CRUD_URL=http://enrollment-api.20.15.57.117.nip.io \
#   GRID_URL=http://enrollment-kendo-grid-api.20.15.57.117.nip.io
